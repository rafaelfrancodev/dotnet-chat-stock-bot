# Development infrastructure for the chat + stock bot challenge.
#
#   cp .env.example .env                                  # once — fill in local-only credentials
#   docker compose -f docker-compose.dev.yml up -d         # start SQL Server + RabbitMQ
#   docker compose -f docker-compose.dev.yml ps            # wait until both report (healthy)
#   docker compose -f docker-compose.dev.yml down          # stop, keep data
#   docker compose -f docker-compose.dev.yml down -v       # stop and wipe the volumes
#
# Both services bind to localhost only. Credentials come from .env, which is git-ignored.

name: chat-stock-bot

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chat-sqlserver
    hostname: chat-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 requires -C (trust the container's self-signed certificate).
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: chat-rabbitmq
    hostname: chat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672" # AMQP
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # Management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
  rabbitmq-data:
